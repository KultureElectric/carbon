[package]
name = "carbon-jetstreamer-datasource"
description = "Carbon Jetstreamer Datasource"
license = { workspace = true }
version = "2.0.0"
edition = { workspace = true }
readme = "README.md"
repository = { workspace = true }
keywords = ["solana", "indexer", "jetstreamer", "datasource"]
categories = ["encoding"]

[lib]
crate-type = ["rlib"]

[dependencies]
async-trait = { workspace = true }
carbon-core = { workspace = true }
futures-util = { workspace = true }
# Transaction V1 and Agave 4 support landed after the published 0.7.0 tag.
jetstreamer-firehose = { git = "https://github.com/anza-xyz/jetstreamer", rev = "67a93cae808d8d2cf93dded699c02f875394ad82" }
# Keep Cargo from selecting Jetstreamer's lowest Agave 4 release when this
# crate is resolved inside a larger pre-existing lockfile.
solana-accounts-db = { workspace = true }
solana-pubkey = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
solana-hash = { workspace = true }
solana-message = { workspace = true }
solana-signature = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-status = { workspace = true }
